spring:
  application:
    name: backend-lab
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # 운영에서는 반드시 환경변수로 주입 (기본값 fallback 없음)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc.batch_size: 1000
        order_inserts: true
        order_updates: true
        type.json_format_mapper: org.hibernate.type.format.StringJsonFormatMapper
  flyway:
    enabled: true
    # baseline-on-migrate 는 위험하므로 dev 프로파일에서만 true 로 override
    baseline-on-migrate: false
    validate-on-migrate: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.stat: WARN
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-2.5-pro-preview-05-06

telegram:
  enabled: ${TELEGRAM_ENABLED:false}
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
  base-url: https://api.telegram.org

content:
  scheduler:
    cron: "0 0 18 * * *"
  news:
    rss-urls:
      - https://www.yna.co.kr/rss/economy.xml
      - https://www.hankyung.com/feed/economy
      - https://news.kbs.co.kr/rss/rss.do?cat=economy
    max-items: 10


